<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc JS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main id="calculator">
        <h3>Calculadora</h3>
        <div id="operations-container">
            <div id="previous-operations">123+</div>
            <div id="current-operations">543</div>
        </div>
        <div id="buttons-container">
            <button>CE</button>
            <button>C</button>
            <button>DEL</button>
            <button>/</button>
            <button class="number">7</buttons>
            <button class="number">8</buttons>
            <button class="number">9</buttons>
            <button>*</button>
            <button class="number">4</buttons>
            <button class="number">5</buttons>
            <button class="number">6</buttons>
            <button>-</button>
            <button class="number">1</buttons>
            <button class="number">2</buttons>
            <button class="number">3</buttons>
            <button>+</button>
            <button class="number">0</buttons>
            <button>.</button>
            <button id="equal-btn">=</button>
        </div>
    </main>
</body>
</html>
